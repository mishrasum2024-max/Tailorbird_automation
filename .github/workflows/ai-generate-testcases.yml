name: AI Generate Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

jobs:
  generate-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        run: |
          claude --version

      - name: Generate test cases with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude \
            --permission-mode bypassPermissions \
            -p "$(cat <<'EOF'
          Read the ticket context from:

          data/current-ticket-context.json

          Your task is to analyze the ticket and generate comprehensive QA TEST CASES ONLY.

          ============================================================
          IMPORTANT SCOPE
          ============================================================

          This workflow is ONLY responsible for generating test-case
          documentation.

          DO NOT automate the test cases.

          DO NOT modify the existing automation framework.

          DO NOT create a PR.

          DO NOT create a branch.

          DO NOT commit anything.

          ============================================================
          DO NOT DO
          ============================================================

          - Do NOT create Playwright spec files.
          - Do NOT modify any existing files inside tests/.
          - Do NOT write Playwright automation code.
          - Do NOT write JavaScript automation code.
          - Do NOT use Playwright MCP.
          - Do NOT open or interact with the application.
          - Do NOT create a branch.
          - Do NOT create a commit.
          - Do NOT create a pull request.
          - Do NOT modify package.json.
          - Do NOT modify configuration files.
          - Do NOT modify any existing source files.

          ============================================================
          TICKET ANALYSIS
          ============================================================

          Read and analyze:

          data/current-ticket-context.json

          Use all available information including:

          - Ticket ID
          - Ticket title
          - Description
          - Requirements
          - Acceptance criteria
          - Expected behavior
          - User flows
          - Business rules
          - Any other ticket information available in the file

          Do not generate generic test cases when the ticket provides
          enough information to create ticket-specific scenarios.

          ============================================================
          TEST CASE COVERAGE
          ============================================================

          Generate comprehensive test cases covering the relevant areas:

          1. Positive test cases
          2. Negative test cases
          3. Edge cases
          4. Visual/UI test cases
          5. End-to-end test cases

          Only include categories that are relevant to the ticket,
          but make sure the important scenarios are covered.

          Think like a senior QA engineer reviewing the feature before
          automation begins.

          Include:

          - Happy paths
          - Validation scenarios
          - Invalid input scenarios
          - Boundary conditions
          - Empty/null states where applicable
          - Permission/access scenarios where applicable
          - UI behavior
          - Error handling
          - Data persistence where applicable
          - Navigation where applicable
          - End-to-end user flows
          - Regression scenarios directly related to the feature

          ============================================================
          TEST CASE FORMAT
          ============================================================

          Every test case MUST contain:

          - Test Case ID
          - Title
          - Type
          - Priority
          - Preconditions
          - Test Steps
          - Expected Result

          Type MUST be one of:

          - Positive
          - Negative
          - Edge
          - Visual/UI
          - E2E

          Priority MUST be one of:

          - P0
          - P1
          - P2
          - P3

          Test Case IDs must be unique within this ticket.

          Use clear, human-readable test case titles.

          ============================================================
          JSON OUTPUT
          ============================================================

          Create:

          data/generated-testcases.json

          The structure MUST be:

          {
            "ticketId": "...",
            "ticketTitle": "...",
            "testCases": [
              {
                "id": "TC001",
                "title": "...",
                "type": "Positive",
                "priority": "P1",
                "preconditions": [
                  "..."
                ],
                "steps": [
                  "Step 1",
                  "Step 2",
                  "Step 3"
                ],
                "expectedResult": "..."
              }
            ]
          }

          Make sure the JSON is valid JSON.

          Do not put markdown inside the JSON.

          ============================================================
          MARKDOWN OUTPUT
          ============================================================

          Also create:

          data/generated-testcases.md

          Format it as:

          # Generated Test Cases

          ## Ticket Information

          - Ticket ID:
          - Ticket Title:

          ## TC001 - Test Case Title

          - Type:
          - Priority:

          ### Preconditions

          - ...

          ### Steps

          1. ...
          2. ...
          3. ...

          ### Expected Result

          ...

          Repeat this structure for every test case.

          ============================================================
          FILE RESTRICTIONS
          ============================================================

          You may ONLY create or modify these two files:

          data/generated-testcases.json
          data/generated-testcases.md

          Do not modify anything else.

          ============================================================
          FINAL VALIDATION
          ============================================================

          Before finishing, verify:

          1. data/generated-testcases.json exists.
          2. data/generated-testcases.md exists.
          3. generated-testcases.json contains valid JSON.
          4. Both files contain actual test cases.
          5. Every test case has:
             - id
             - title
             - type
             - priority
             - preconditions
             - steps
             - expectedResult
          6. Test case IDs are unique.
          7. No file inside tests/ was modified.
          8. No Playwright spec file was created.
          9. No automation code was generated.
          10. No PR was created.
          11. No branch was created.
          12. No commit was created.

          IMPORTANT:

          The final output of this workflow is TEST CASE DOCUMENTATION ONLY.

          Do not automate anything.

          EOF
          )"

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: data/generated-testcases.json was not created."
            exit 1
          fi

          if [ ! -f "data/generated-testcases.md" ]; then
            echo "ERROR: data/generated-testcases.md was not created."
            exit 1
          fi

          echo "Generated JSON found."
          echo "Generated Markdown found."

          echo ""
          echo "Validating JSON..."

          node -e "
          const fs = require('fs');

          const file = 'data/generated-testcases.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!data.testCases || !Array.isArray(data.testCases)) {
            throw new Error('testCases array is missing.');
          }

          if (data.testCases.length === 0) {
            throw new Error('No test cases were generated.');
          }

          const requiredFields = [
            'id',
            'title',
            'type',
            'priority',
            'preconditions',
            'steps',
            'expectedResult'
          ];

          const ids = new Set();

          for (const testCase of data.testCases) {
            for (const field of requiredFields) {
              if (!(field in testCase)) {
                throw new Error(
                  'Missing field ' + field + ' in test case ' + testCase.id
                );
              }
            }

            if (ids.has(testCase.id)) {
              throw new Error(
                'Duplicate test case ID: ' + testCase.id
              );
            }

            ids.add(testCase.id);
          }

          console.log(
            'Valid JSON with ' +
            data.testCases.length +
            ' test cases.'
          );
          "

          echo ""
          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"

          cat data/generated-testcases.md

      - name: Verify no test automation was created
        run: |
          echo "======================================"
          echo "CHECKING FOR UNEXPECTED TEST CHANGES"
          echo "======================================"

          if git status --short -- tests/ | grep -q .; then
            echo "ERROR: Claude modified files inside tests/."
            git status --short -- tests/
            exit 1
          fi

          echo "No files inside tests/ were modified."

      - name: Verify only testcase documentation changed
        run: |
          echo "======================================"
          echo "CHECKING FILE CHANGES"
          echo "======================================"

          CHANGED_FILES="$(git status --short | awk '{print $2}')"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          for file in $CHANGED_FILES; do
            case "$file" in
              data/generated-testcases.json)
                ;;
              data/generated-testcases.md)
                ;;
              *)
                echo "ERROR: Unexpected file modified: $file"
                exit 1
                ;;
            esac
          done

          echo "Only test-case documentation files were created/modified."

      - name: Workflow summary
        run: |
          echo "======================================"
          echo "AI TEST CASE GENERATION COMPLETED"
          echo "======================================"

          echo "Ticket: ${{ inputs.ticket_id }}"

          echo ""
          echo "Generated:"
          echo "  - data/generated-testcases.json"
          echo "  - data/generated-testcases.md"

          echo ""
          echo "No Playwright automation generated."
          echo "No tests/ files modified."
          echo "No branch created."
          echo "No commit created."
          echo "No PR created."

          echo "======================================"