name: AI Generate Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

jobs:
  generate-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        run: |
          claude --version

      - name: Generate test cases with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude \
            --permission-mode acceptEdits \
            -p "$(cat <<'EOF'

          Read the ticket context from:

          data/current-ticket-context.json

          Your task is to analyze the ticket and generate comprehensive QA TEST CASES ONLY.

          ==================================================
          IMPORTANT
          ==================================================

          This workflow is ONLY for generating test case documentation.

          DO NOT implement or automate any test cases.

          DO NOT create or modify Playwright automation.

          ==================================================
          STRICT RESTRICTIONS
          ==================================================

          DO NOT:

          - Create Playwright spec files
          - Modify any existing files inside tests/
          - Create JavaScript automation code
          - Create TypeScript automation code
          - Write Playwright automation code
          - Use Playwright MCP
          - Open or interact with the application using a browser
          - Create a branch
          - Create a commit
          - Create a pull request
          - Modify existing test automation
          - Modify package.json
          - Modify configuration files

          You may ONLY create or update these two files:

          data/generated-testcases.json
          data/generated-testcases.md

          ==================================================
          TICKET ANALYSIS
          ==================================================

          Read and analyze the complete ticket context from:

          data/current-ticket-context.json

          Consider:

          - Ticket ID
          - Ticket title
          - Description
          - Requirements
          - Acceptance criteria
          - Expected behavior
          - UI requirements
          - Business rules
          - Validation rules
          - Error handling
          - User workflows
          - Any other relevant information in the ticket

          Do not invent requirements that are not supported by the ticket.

          ==================================================
          TEST CASE COVERAGE
          ==================================================

          Generate practical and ticket-specific test cases covering:

          1. Positive scenarios
          2. Negative scenarios
          3. Edge cases
          4. Visual/UI scenarios
          5. End-to-end scenarios

          Include only scenarios relevant to this ticket.

          Avoid generic test cases.

          Think like a senior QA engineer reviewing the feature for regression risk.

          ==================================================
          REQUIRED TEST CASE FORMAT
          ==================================================

          Every test case must contain:

          - Test Case ID
          - Title
          - Type
          - Priority
          - Preconditions
          - Test Steps
          - Expected Result

          Type must be one of:

          - Positive
          - Negative
          - Edge
          - Visual/UI
          - E2E

          Priority must be one of:

          - P0
          - P1
          - P2
          - P3

          Test Case IDs must be unique within the ticket.

          ==================================================
          JSON OUTPUT
          ==================================================

          Save the structured test cases to:

          data/generated-testcases.json

          Use this structure:

          {
            "ticketId": "...",
            "ticketTitle": "...",
            "testCases": [
              {
                "id": "TC001",
                "title": "...",
                "type": "Positive",
                "priority": "P1",
                "preconditions": [
                  "..."
                ],
                "steps": [
                  "...",
                  "...",
                  "..."
                ],
                "expectedResult": "..."
              }
            ]
          }

          Make sure the JSON is valid.

          ==================================================
          MARKDOWN OUTPUT
          ==================================================

          Also create:

          data/generated-testcases.md

          Use this structure:

          # Generated Test Cases

          ## Ticket Information

          - Ticket ID:
          - Ticket Title:

          ## TC001 - Test Case Title

          - Type:
          - Priority:

          ### Preconditions

          - ...

          ### Steps

          1. ...
          2. ...
          3. ...

          ### Expected Result

          ...

          Repeat the same structure for every test case.

          ==================================================
          FINAL VALIDATION
          ==================================================

          Before finishing, verify all of the following:

          1. data/generated-testcases.json exists
          2. data/generated-testcases.md exists
          3. generated-testcases.json contains valid JSON
          4. Both files contain actual test cases
          5. Every test case has:
             - ID
             - Title
             - Type
             - Priority
             - Preconditions
             - Steps
             - Expected Result
          6. Test case IDs are unique
          7. No Playwright spec file was created
          8. No file inside tests/ was modified
          9. No automation code was created
          10. No branch was created
          11. No commit was created
          12. No PR was created

          ==================================================
          FINAL OUTPUT
          ==================================================

          The ONLY deliverable from this workflow is:

          data/generated-testcases.json
          data/generated-testcases.md

          Do not automate anything.

          EOF
          )"

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: data/generated-testcases.json was not created."
            exit 1
          fi

          if [ ! -f "data/generated-testcases.md" ]; then
            echo "ERROR: data/generated-testcases.md was not created."
            exit 1
          fi

          echo "generated-testcases.json found."
          echo "generated-testcases.md found."

          echo ""
          echo "Validating JSON..."

          node -e "
            const fs = require('fs');

            const file = 'data/generated-testcases.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            if (!data.testCases || !Array.isArray(data.testCases)) {
              throw new Error('testCases array is missing.');
            }

            if (data.testCases.length === 0) {
              throw new Error('No test cases were generated.');
            }

            for (const tc of data.testCases) {
              const required = [
                'id',
                'title',
                'type',
                'priority',
                'preconditions',
                'steps',
                'expectedResult'
              ];

              for (const field of required) {
                if (
                  tc[field] === undefined ||
                  tc[field] === null ||
                  tc[field] === ''
                ) {
                  throw new Error(
                    'Missing required field: ' + field + ' in ' + tc.id
                  );
                }
              }
            }

            const ids = data.testCases.map(tc => tc.id);
            const uniqueIds = new Set(ids);

            if (ids.length !== uniqueIds.size) {
              throw new Error('Duplicate test case IDs found.');
            }

            console.log(
              'Valid JSON. Generated ' +
              data.testCases.length +
              ' test cases.'
            );
          "

          echo ""
          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"

          cat data/generated-testcases.md

      - name: Verify no test automation was created
        run: |
          echo "======================================"
          echo "CHECKING FOR UNEXPECTED TEST CHANGES"
          echo "======================================"

          if git status --short -- tests/ | grep -q .; then
            echo "ERROR: Claude modified files inside tests/."
            git status --short -- tests/
            exit 1
          fi

          echo "No files inside tests/ were modified."

      - name: Workflow summary
        run: |
          echo "======================================"
          echo "AI TEST CASE GENERATION COMPLETED"
          echo "======================================"

          echo "Ticket: ${{ inputs.ticket_id }}"

          echo ""
          echo "Test cases generated successfully."

          echo ""
          echo "Files created:"
          echo "  - data/generated-testcases.json"
          echo "  - data/generated-testcases.md"

          echo ""
          echo "No Playwright automation was generated."
          echo "No PR was created."

          echo "======================================"