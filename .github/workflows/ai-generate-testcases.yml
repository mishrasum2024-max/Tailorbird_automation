name: AI Generate Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

jobs:
  generate-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install project dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 4. Get ticket information from Notion
      # ---------------------------------------------------------
      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      # ---------------------------------------------------------
      # 5. Install Claude Code
      # ---------------------------------------------------------
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------
      # 6. Verify Claude installation
      # ---------------------------------------------------------
      - name: Verify Claude Code installation
        run: |
          claude --version

      # ---------------------------------------------------------
      # 7. Generate TEST CASES ONLY
      # ---------------------------------------------------------
      - name: Generate test cases with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude \
            --permission-mode acceptEdits \
            -p "$(cat <<'EOF'

          Read the ticket context from:

          data/current-ticket-context.json

          ============================================================
          YOUR TASK
          ============================================================

          Analyze the ticket and generate comprehensive QA TEST CASES ONLY.

          The purpose of this workflow is ONLY to generate test-case
          documentation for human review.

          DO NOT automate any test case.

          ============================================================
          STRICT RESTRICTIONS
          ============================================================

          DO NOT:

          - Create Playwright spec files
          - Modify any existing files inside tests/
          - Write Playwright automation code
          - Write JavaScript automation code for tests
          - Use Playwright MCP
          - Open a browser
          - Navigate the application
          - Interact with the application
          - Create a branch
          - Create a commit
          - Create a pull request
          - Modify existing automation
          - Modify existing test cases

          You are generating documentation only.

          ============================================================
          TICKET ANALYSIS
          ============================================================

          Read the complete ticket context from:

          data/current-ticket-context.json

          Analyze:

          - Ticket ID
          - Ticket title
          - Description
          - Requirements
          - Acceptance criteria
          - Expected behavior
          - User flows
          - Business rules
          - Validation rules
          - UI behavior
          - Error behavior
          - Any other useful information present in the ticket

          Generate test cases specifically for this ticket.

          Do NOT generate generic test cases that are unrelated to
          the ticket.

          ============================================================
          TEST COVERAGE
          ============================================================

          Generate test cases covering the following categories where
          applicable:

          1. Positive test cases
          2. Negative test cases
          3. Edge cases
          4. Visual/UI test cases
          5. End-to-end test cases

          Make sure the test cases provide meaningful QA coverage.

          Include important boundary conditions, validation behavior,
          error handling, UI behavior, and end-to-end user flows
          whenever they are relevant to the ticket.

          ============================================================
          TEST CASE FORMAT
          ============================================================

          Every test case MUST contain:

          - Test Case ID
          - Title
          - Type
          - Priority
          - Preconditions
          - Test Steps
          - Expected Result

          Type MUST be one of:

          - Positive
          - Negative
          - Edge
          - Visual/UI
          - E2E

          Priority MUST be one of:

          - P0
          - P1
          - P2
          - P3

          Test Case IDs must be unique within this ticket.

          ============================================================
          JSON OUTPUT
          ============================================================

          Save the structured test cases to:

          data/generated-testcases.json

          Use this structure:

          {
            "ticketId": "...",
            "ticketTitle": "...",
            "testCases": [
              {
                "id": "TC001",
                "title": "...",
                "type": "Positive",
                "priority": "P1",
                "preconditions": [
                  "..."
                ],
                "steps": [
                  "...",
                  "...",
                  "..."
                ],
                "expectedResult": "..."
              }
            ]
          }

          Make sure the JSON is valid JSON.

          ============================================================
          MARKDOWN OUTPUT
          ============================================================

          Also save a human-readable version to:

          data/generated-testcases.md

          Use this format:

          # Generated Test Cases

          ## Ticket Information

          - Ticket ID:
          - Ticket Title:

          ## TC001 - Test Case Title

          - Type:
          - Priority:

          ### Preconditions

          - ...

          ### Steps

          1. ...
          2. ...
          3. ...

          ### Expected Result

          ...

          Repeat this format for every test case.

          ============================================================
          FINAL VALIDATION
          ============================================================

          Before finishing, verify:

          1. data/generated-testcases.json exists
          2. data/generated-testcases.md exists
          3. generated-testcases.json contains valid JSON
          4. Both files contain actual test cases
          5. Every test case has:
             - ID
             - Title
             - Type
             - Priority
             - Preconditions
             - Steps
             - Expected Result
          6. Test Case IDs are unique
          7. No file inside tests/ was modified
          8. No Playwright spec file was created
          9. No automation code was created
          10. No branch was created
          11. No commit was created
          12. No PR was created

          ============================================================
          IMPORTANT
          ============================================================

          The ONLY intended output of this workflow is:

          data/generated-testcases.json
          data/generated-testcases.md

          Do not implement the test cases.

          Do not automate the test cases.

          Do not use Playwright MCP.

          Do not create or modify test automation.

          EOF
          )"

      # ---------------------------------------------------------
      # 8. Verify generated files
      # ---------------------------------------------------------
      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: data/generated-testcases.json was not created."
            exit 1
          fi

          if [ ! -f "data/generated-testcases.md" ]; then
            echo "ERROR: data/generated-testcases.md was not created."
            exit 1
          fi

          echo "generated-testcases.json found."
          echo "generated-testcases.md found."

          echo ""
          echo "======================================"
          echo "VALIDATING JSON"
          echo "======================================"

          node -e "
            const fs = require('fs');

            const file = 'data/generated-testcases.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            if (!data.testCases || !Array.isArray(data.testCases)) {
              throw new Error('testCases array is missing.');
            }

            if (data.testCases.length === 0) {
              throw new Error('No test cases were generated.');
            }

            for (const tc of data.testCases) {
              if (!tc.id) throw new Error('Test case missing ID.');
              if (!tc.title) throw new Error(tc.id + ' missing title.');
              if (!tc.type) throw new Error(tc.id + ' missing type.');
              if (!tc.priority) throw new Error(tc.id + ' missing priority.');
              if (!tc.preconditions) throw new Error(tc.id + ' missing preconditions.');
              if (!tc.steps) throw new Error(tc.id + ' missing steps.');
              if (!tc.expectedResult) throw new Error(tc.id + ' missing expectedResult.');
            }

            console.log('Valid JSON.');
            console.log('Test cases generated: ' + data.testCases.length);
          "

          echo ""
          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"

          cat data/generated-testcases.md

      # ---------------------------------------------------------
      # 9. Make absolutely sure tests/ was not modified
      # ---------------------------------------------------------
      - name: Verify no test automation was created
        run: |
          echo "======================================"
          echo "CHECKING TEST AUTOMATION CHANGES"
          echo "======================================"

          if git status --short -- tests/ | grep -q .; then
            echo "ERROR: Files inside tests/ were modified."
            git status --short -- tests/
            exit 1
          fi

          echo "No files inside tests/ were modified."

      # ---------------------------------------------------------
      # 10. Final summary
      # ---------------------------------------------------------
      - name: Workflow summary
        run: |
          echo "======================================"
          echo "AI TEST CASE GENERATION COMPLETED"
          echo "======================================"

          echo "Ticket: ${{ inputs.ticket_id }}"

          echo ""
          echo "Generated:"
          echo "  data/generated-testcases.json"
          echo "  data/generated-testcases.md"

          echo ""
          echo "No Playwright automation generated."
          echo "No tests/ files modified."
          echo "No branch created."
          echo "No commit created."
          echo "No PR created."

          echo ""
          echo "Next step:"
          echo "Send generated test cases to Slack for human selection."

          echo "======================================"