name: AI Generate Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

jobs:
  generate-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        run: |
          claude --version

      - name: Generate test cases with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude \
            --allowedTools "Read,Write" \
            -p "$(cat <<'EOF'

          Read the ticket context from:

          data/current-ticket-context.json

          Your task is to analyze the ticket and generate comprehensive QA TEST CASES ONLY.

          ==================================================
          IMPORTANT
          ==================================================

          DO NOT implement or automate any test cases.

          DO NOT:
          - Create Playwright spec files
          - Modify any existing files inside tests/
          - Write Playwright automation code
          - Write JavaScript automation code
          - Use Playwright MCP
          - Open or interact with the application using a browser
          - Create a branch
          - Create a commit
          - Create a pull request

          You are generating TEST CASE DOCUMENTATION ONLY.

          ==================================================
          TICKET ANALYSIS
          ==================================================

          Read and analyze the complete ticket context, including:

          - Ticket title
          - Ticket description
          - Requirements
          - Acceptance criteria
          - Expected behavior
          - Any additional ticket information

          Do not generate generic test cases.

          Test cases must be specific to the ticket.

          ==================================================
          TEST COVERAGE
          ==================================================

          Generate test cases covering:

          1. Positive scenarios
          2. Negative scenarios
          3. Edge cases
          4. Visual/UI scenarios
          5. End-to-end scenarios

          Include only scenarios that are relevant to the ticket.

          ==================================================
          TEST CASE FORMAT
          ==================================================

          Every test case MUST contain:

          - Test Case ID
          - Title
          - Type
          - Priority
          - Preconditions
          - Test Steps
          - Expected Result

          Allowed Type values:

          - Positive
          - Negative
          - Edge
          - Visual/UI
          - E2E

          Allowed Priority values:

          - P0
          - P1
          - P2
          - P3

          Test Case IDs must be unique within the ticket.

          ==================================================
          JSON OUTPUT
          ==================================================

          Create:

          data/generated-testcases.json

          Use this structure:

          {
            "ticketId": "...",
            "ticketTitle": "...",
            "testCases": [
              {
                "id": "TC001",
                "title": "...",
                "type": "Positive",
                "priority": "P1",
                "preconditions": [
                  "..."
                ],
                "steps": [
                  "Step 1",
                  "Step 2",
                  "Step 3"
                ],
                "expectedResult": "..."
              }
            ]
          }

          ==================================================
          MARKDOWN OUTPUT
          ==================================================

          Also create:

          data/generated-testcases.md

          Use this structure:

          # Generated Test Cases

          ## Ticket Information

          - Ticket ID:
          - Ticket Title:

          ## TC001 - Test Case Title

          - Type:
          - Priority:

          ### Preconditions

          - ...

          ### Steps

          1. ...
          2. ...
          3. ...

          ### Expected Result

          ...

          Repeat this structure for every test case.

          ==================================================
          FILE RESTRICTIONS
          ==================================================

          You may ONLY create or modify these two files:

          data/generated-testcases.json
          data/generated-testcases.md

          Do NOT modify anything else.

          In particular:

          - Do not modify tests/
          - Do not create spec files
          - Do not create automation code
          - Do not modify package files
          - Do not modify workflow files
          - Do not create branches
          - Do not create commits
          - Do not create PRs

          ==================================================
          FINAL VALIDATION
          ==================================================

          Before finishing, verify:

          1. data/generated-testcases.json exists
          2. data/generated-testcases.md exists
          3. JSON contains test cases
          4. Markdown contains test cases
          5. Every test case has:
             - ID
             - Title
             - Type
             - Priority
             - Preconditions
             - Steps
             - Expected Result
          6. No files inside tests/ were modified
          7. No Playwright spec file was created
          8. No automation code was generated

          Do not ask for permission.

          Simply generate the two requested documentation files.

          EOF
          )"

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: data/generated-testcases.json was not created."
            exit 1
          fi

          if [ ! -f "data/generated-testcases.md" ]; then
            echo "ERROR: data/generated-testcases.md was not created."
            exit 1
          fi

          if [ ! -s "data/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json is empty."
            exit 1
          fi

          if [ ! -s "data/generated-testcases.md" ]; then
            echo "ERROR: generated-testcases.md is empty."
            exit 1
          fi

          echo "generated-testcases.json found."
          echo "generated-testcases.md found."

          echo ""
          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"

          cat data/generated-testcases.md

      - name: Verify no test automation was created
        run: |
          echo "======================================"
          echo "CHECKING FOR UNEXPECTED TEST CHANGES"
          echo "======================================"

          if git status --short -- tests/ | grep -q .; then
            echo "ERROR: Claude modified files inside tests/."
            git status --short -- tests/
            exit 1
          fi

          echo "No files inside tests/ were modified."

      - name: Workflow summary
        run: |
          echo "======================================"
          echo "AI TEST CASE GENERATION COMPLETED"
          echo "======================================"

          echo "Ticket: ${{ inputs.ticket_id }}"

          echo ""
          echo "Generated files:"
          echo "  - data/generated-testcases.json"
          echo "  - data/generated-testcases.md"

          echo ""
          echo "No Playwright automation was generated."
          echo "No branch was created."
          echo "No commit was created."
          echo "No PR was created."

          echo "======================================"