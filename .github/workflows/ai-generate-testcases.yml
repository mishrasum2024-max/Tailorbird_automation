name: AI Generate Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

jobs:
  generate-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        run: |
          claude --version

      - name: Generate test cases with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p data

          claude -p "$(cat <<'EOF'
          Read the ticket context from:

          data/current-ticket-context.json

          Generate comprehensive QA test cases for this ticket.

          IMPORTANT:
          Your output MUST be JSON only.
          Do not use markdown.
          Do not use code fences.
          Do not write or modify any files.

          Do NOT:
          - Create Playwright spec files
          - Modify files inside tests/
          - Write automation code
          - Use Playwright MCP
          - Open or interact with the application
          - Create a branch
          - Create a commit
          - Create a pull request

          Analyze the complete ticket context, including:
          - Ticket title
          - Description
          - Requirements
          - Acceptance criteria
          - Expected behavior
          - Any other available ticket information

          Generate practical, ticket-specific test cases covering:

          1. Positive test cases
          2. Negative test cases
          3. Edge cases
          4. Visual/UI test cases
          5. End-to-end test cases

          Avoid generic test cases that are not relevant to the ticket.

          Each test case MUST contain:

          - id
          - title
          - type
          - priority
          - preconditions
          - steps
          - expectedResult

          Allowed Type values:

          - Positive
          - Negative
          - Edge
          - Visual/UI
          - E2E

          Allowed Priority values:

          - P0
          - P1
          - P2
          - P3

          Test case IDs must be unique within this ticket.

          Return EXACTLY this structure:

          {
            "ticketId": "...",
            "ticketTitle": "...",
            "testCases": [
              {
                "id": "TC001",
                "title": "...",
                "type": "Positive",
                "priority": "P1",
                "preconditions": [
                  "..."
                ],
                "steps": [
                  "Step 1",
                  "Step 2",
                  "Step 3"
                ],
                "expectedResult": "..."
              }
            ]
          }

          Return JSON only.
          EOF
          )" > data/claude-output.txt

      - name: Create test case files
        run: |
          echo "======================================"
          echo "CREATING TEST CASE FILES"
          echo "======================================"

          python3 - <<'PY'
          import json
          from pathlib import Path

          output_file = Path("data/claude-output.txt")
          json_file = Path("data/generated-testcases.json")
          md_file = Path("data/generated-testcases.md")

          raw = output_file.read_text().strip()

          if not raw:
              raise SystemExit("ERROR: Claude returned empty output.")

          # Remove accidental markdown code fences if Claude adds them.
          if raw.startswith("```"):
              lines = raw.splitlines()

              if lines and lines[0].strip().startswith("```"):
                  lines = lines[1:]

              if lines and lines[-1].strip() == "```":
                  lines = lines[:-1]

              raw = "\n".join(lines).strip()

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print("Claude output was not valid JSON.")
              print("Raw output:")
              print(raw)
              raise SystemExit(f"ERROR: Invalid JSON: {e}")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Claude output must be a JSON object.")

          if "ticketId" not in data:
              raise SystemExit("ERROR: Missing ticketId.")

          if "ticketTitle" not in data:
              raise SystemExit("ERROR: Missing ticketTitle.")

          if "testCases" not in data:
              raise SystemExit("ERROR: Missing testCases.")

          test_cases = data["testCases"]

          if not isinstance(test_cases, list):
              raise SystemExit("ERROR: testCases must be an array.")

          if len(test_cases) == 0:
              raise SystemExit("ERROR: No test cases were generated.")

          required_fields = [
              "id",
              "title",
              "type",
              "priority",
              "preconditions",
              "steps",
              "expectedResult"
          ]

          allowed_types = {
              "Positive",
              "Negative",
              "Edge",
              "Visual/UI",
              "E2E"
          }

          allowed_priorities = {
              "P0",
              "P1",
              "P2",
              "P3"
          }

          ids = set()

          for index, tc in enumerate(test_cases, start=1):

              for field in required_fields:
                  if field not in tc:
                      raise SystemExit(
                          f"ERROR: Test case {index} is missing field '{field}'."
                      )

              tc_id = tc["id"]

              if tc_id in ids:
                  raise SystemExit(
                      f"ERROR: Duplicate test case ID found: {tc_id}"
                  )

              ids.add(tc_id)

              if tc["type"] not in allowed_types:
                  raise SystemExit(
                      f"ERROR: Invalid test type '{tc['type']}' in {tc_id}"
                  )

              if tc["priority"] not in allowed_priorities:
                  raise SystemExit(
                      f"ERROR: Invalid priority '{tc['priority']}' in {tc_id}"
                  )

              if not isinstance(tc["preconditions"], list):
                  raise SystemExit(
                      f"ERROR: Preconditions must be an array in {tc_id}"
                  )

              if not isinstance(tc["steps"], list):
                  raise SystemExit(
                      f"ERROR: Steps must be an array in {tc_id}"
                  )

              if len(tc["steps"]) == 0:
                  raise SystemExit(
                      f"ERROR: No steps provided for {tc_id}"
                  )

          # Save JSON
          json_file.write_text(
              json.dumps(data, indent=2, ensure_ascii=False)
          )

          # Create Markdown
          md = []

          md.append("# Generated Test Cases")
          md.append("")
          md.append(f"**Ticket ID:** {data['ticketId']}")
          md.append(f"**Ticket Title:** {data['ticketTitle']}")
          md.append("")
          md.append(f"**Total Test Cases:** {len(test_cases)}")
          md.append("")

          md.append("## Test Case Summary")
          md.append("")
          md.append("| ID | Title | Type | Priority |")
          md.append("|---|---|---|---|")

          for tc in test_cases:
              title = str(tc["title"]).replace("|", "\\|")
              md.append(
                  f"| {tc['id']} | {title} | {tc['type']} | {tc['priority']} |"
              )

          md.append("")

          for tc in test_cases:
              md.append(f"## {tc['id']} - {tc['title']}")
              md.append("")
              md.append(f"- **Type:** {tc['type']}")
              md.append(f"- **Priority:** {tc['priority']}")
              md.append("")
              md.append("### Preconditions")
              md.append("")

              if tc["preconditions"]:
                  for item in tc["preconditions"]:
                      md.append(f"- {item}")
              else:
                  md.append("- None")

              md.append("")
              md.append("### Steps")
              md.append("")

              for step_number, step in enumerate(tc["steps"], start=1):
                  md.append(f"{step_number}. {step}")

              md.append("")
              md.append("### Expected Result")
              md.append("")
              md.append(str(tc["expectedResult"]))
              md.append("")

          md_file.write_text("\n".join(md), encoding="utf-8")

          print(f"Created {json_file}")
          print(f"Created {md_file}")
          print(f"Generated {len(test_cases)} test cases.")
          PY

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json was not created."
            exit 1
          fi

          if [ ! -f "data/generated-testcases.md" ]; then
            echo "ERROR: generated-testcases.md was not created."
            exit 1
          fi

          echo "JSON file found."
          echo "Markdown file found."

          echo ""
          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"

          cat data/generated-testcases.md

      - name: Verify no test automation was created
        run: |
          echo "======================================"
          echo "CHECKING FOR TEST AUTOMATION CHANGES"
          echo "======================================"

          if git status --short -- tests/ | grep -q .; then
            echo "ERROR: Claude modified files inside tests/."
            git status --short -- tests/
            exit 1
          fi

          echo "No files inside tests/ were modified."

      - name: Workflow summary
        run: |
          echo "======================================"
          echo "AI TEST CASE GENERATION COMPLETED"
          echo "======================================"
          echo "Ticket: ${{ inputs.ticket_id }}"
          echo "Test cases generated successfully."
          echo ""
          echo "Files created:"
          echo "  - data/generated-testcases.json"
          echo "  - data/generated-testcases.md"
          echo ""
          echo "No Playwright automation was generated."
          echo "No PR was created."
          echo "======================================"