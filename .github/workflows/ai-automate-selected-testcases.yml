name: AI Automate Selected Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Ticket ID"
        required: true
        type: string

      test_case_ids:
        description: "Selected test case IDs (comma-separated)"
        required: true
        type: string

      testcase_run_id:
        description: "GitHub run ID containing generated test cases"
        required: true
        type: string

jobs:
  automate-selected-testcases:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # DOWNLOAD GENERATED TEST CASES
      # ============================================================

      - name: Download generated test cases
        uses: actions/download-artifact@v4
        with:
          name: testcases-${{ inputs.ticket_id }}
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testcase_run_id }}

      # ============================================================
      # VERIFY INPUT
      # ============================================================

      - name: Verify automation input
        env:
          SELECTED_TEST_CASES: ${{ inputs.test_case_ids }}
        run: |
          echo "======================================"
          echo "AI TEST AUTOMATION"
          echo "======================================"

          echo "Ticket:"
          echo "${{ inputs.ticket_id }}"

          echo ""
          echo "Selected test cases:"
          echo "$SELECTED_TEST_CASES"

          echo ""
          echo "Test-case generation run:"
          echo "${{ inputs.testcase_run_id }}"

          echo ""

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json not found."
            exit 1
          fi

          echo "generated-testcases.json found."

      # ============================================================
      # FILTER SELECTED TEST CASES
      # ============================================================

      - name: Prepare selected test cases
        env:
          SELECTED_TEST_CASES: ${{ inputs.test_case_ids }}
        run: |
          echo "======================================"
          echo "FILTERING SELECTED TEST CASES"
          echo "======================================"

          node scripts/ai-agent/filter-selected-testcases.js

          echo ""
          echo "======================================"
          echo "SELECTED TEST CASES FILE"
          echo "======================================"

          cat data/selected-testcases.json

      # ============================================================
      # INSTALL CLAUDE CODE
      # ============================================================

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code
        run: |
          claude --version

      # ============================================================
      # AUTOMATE SELECTED TEST CASES
      # ============================================================

      - name: Automate selected test cases
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |

          claude \
            --permission-mode acceptEdits \
            -p "$(cat <<'EOF'

          ============================================================
          AI TEST AUTOMATION AGENT
          ============================================================

          You are responsible for implementing Playwright automation
          for ONLY the test cases selected by the user.

          ============================================================
          SOURCE FILES
          ============================================================

          Read:

          1. data/current-ticket-context.json

          2. data/generated-testcases.json

          3. data/selected-testcases.json

          4. Existing Playwright tests

          5. Existing fixtures

          6. Existing page objects

          7. Existing locators

          8. Existing utilities

          9. Existing committed UI snapshots when visual testing
             is required.

          ============================================================
          CRITICAL RULE
          ============================================================

          AUTOMATE ONLY:

          data/selected-testcases.json

          Do NOT automate every test case from the ticket.

          Do NOT automate every generated test case.

          Do NOT choose additional test cases yourself.

          The user has explicitly selected the test cases.

          ============================================================
          TEST CASE SELECTION
          ============================================================

          Read:

          data/selected-testcases.json

          It contains the exact test cases that must be automated.

          For example:

          TC001
          TC007
          TC029

          means ONLY those three test cases must be implemented.

          ============================================================
          UNDERSTAND THE EXISTING FRAMEWORK
          ============================================================

          Before writing code:

          - inspect the repository
          - inspect existing Playwright tests
          - inspect fixtures
          - inspect page objects
          - inspect locators
          - inspect helper utilities
          - inspect authentication/session handling
          - inspect existing test naming conventions
          - inspect existing visual testing patterns
          - inspect existing assertions

          Reuse the existing framework wherever possible.

          Do NOT create a new testing architecture.

          ============================================================
          PLAYWRIGHT
          ============================================================

          Use Playwright.

          Use existing repository patterns.

          Use Playwright MCP browser when browser exploration,
          UI verification or locator discovery is required.

          Do not invent UI behavior.

          Do not invent selectors.

          Do not invent application APIs.

          Verify behavior against the actual application whenever
          possible.

          ============================================================
          TEST IMPLEMENTATION
          ============================================================

          For every selected test case:

          1. Understand the expected behavior.

          2. Find the correct existing test file.

          3. Reuse existing fixtures/helpers/page objects.

          4. Add the test using repository conventions.

          5. Use stable locators.

          6. Add meaningful assertions.

          7. Handle the required setup and cleanup.

          8. Run the test when possible.

          ============================================================
          CATEGORY HANDLING
          ============================================================

          If the selected test case is:

          E2E:
          Implement the complete user journey.

          POSITIVE:
          Implement the expected successful behavior.

          NEGATIVE:
          Implement the invalid/error scenario and assertions.

          EDGE:
          Implement the boundary/unusual condition.

          UI:
          Verify UI behavior, state and interaction.

          VISUAL:
          Follow the repository's existing screenshot/
          visual-regression approach.

          Do not convert a visual test into a normal functional
          test unless the repository's existing framework requires it.

          ============================================================
          DO NOT MODIFY UNRELATED CODE
          ============================================================

          Do NOT:

          - modify unrelated tests
          - modify application source code
          - modify package dependencies unnecessarily
          - modify configuration unnecessarily
          - modify fixtures unless required
          - modify locators unrelated to the selected tests
          - rewrite existing tests unnecessarily

          Only make changes required to automate the selected
          test cases.

          ============================================================
          TEST VALIDATION
          ============================================================

          Before finishing:

          1. Confirm every selected test case has an implementation.

          2. Confirm no unselected test case was implemented.

          3. Confirm test names clearly correspond to the selected IDs.

          4. Run relevant tests.

          5. Fix obvious failures caused by the generated code.

          6. Check that the generated test files are valid.

          7. Check git diff.

          8. Ensure unrelated files are not modified.

          ============================================================
          IMPORTANT
          ============================================================

          DO NOT:

          - create a branch
          - commit
          - push
          - create a PR

          The GitHub Actions workflow will handle all Git operations.

          ============================================================

          EOF
          )"

      # ============================================================
      # VERIFY GENERATED AUTOMATION
      # ============================================================

      - name: Verify generated automation
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED AUTOMATION"
          echo "======================================"

          git status --short

          echo ""

          if [ -z "$(git status --porcelain -- tests/)" ]; then
            echo "ERROR: No test automation was generated."
            exit 1
          fi

          echo "Test automation changes detected."

      # ============================================================
      # CREATE BRANCH
      # ============================================================

      - name: Create automation branch
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |

          BRANCH="ai/${TICKET_ID}-selected-tests"

          echo "Creating branch:"
          echo "$BRANCH"

          git config user.name "tailorbird-ai-agent[bot]"
          git config user.email "tailorbird-ai-agent[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # ============================================================
      # COMMIT TEST AUTOMATION
      # ============================================================

      - name: Commit generated automation
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |

          git add tests/

          git diff --cached --stat

          git commit \
            -m "AI-generated selected tests for ${TICKET_ID}"

      # ============================================================
      # PUSH BRANCH
      # ============================================================

      - name: Push automation branch
        run: |

          git push origin "$BRANCH"

      # ============================================================
      # CREATE PR
      # ============================================================

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET_ID: ${{ inputs.ticket_id }}
          SELECTED_TEST_CASES: ${{ inputs.test_case_ids }}
        run: |

          echo "======================================"
          echo "CREATING PULL REQUEST"
          echo "======================================"

          PR_URL=$(gh pr create \
            --title "AI-generated selected tests for ${TICKET_ID}" \
            --body "## AI Test Automation

          Ticket: ${TICKET_ID}

          ### Selected Test Cases

          ${SELECTED_TEST_CASES}

          ### Automation

          Only the test cases explicitly selected in Slack were automated.

          Generated by the AI automation agent." \
            --base main \
            --head "$BRANCH")

          echo ""
          echo "PR created:"
          echo "$PR_URL"

          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Workflow summary
        env:
          TICKET_ID: ${{ inputs.ticket_id }}
          SELECTED_TEST_CASES: ${{ inputs.test_case_ids }}
        run: |

          echo "======================================"
          echo "🎉 AI AUTOMATION COMPLETED"
          echo "======================================"

          echo "Ticket:"
          echo "$TICKET_ID"

          echo ""
          echo "Selected test cases:"
          echo "$SELECTED_TEST_CASES"

          echo ""
          echo "Branch:"
          echo "$BRANCH"

          echo ""
          echo "Pull Request:"
          echo "$PR_URL"

          echo "======================================"