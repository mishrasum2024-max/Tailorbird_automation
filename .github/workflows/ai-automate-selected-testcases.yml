name: AI Automate Selected Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Ticket ID"
        required: true
        type: string

      test_case_ids:
        description: "Selected test case IDs (comma-separated)"
        required: true
        type: string

      testcase_run_id:
        description: "GitHub run ID containing generated test cases"
        required: true
        type: string

jobs:
  automate-selected-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    env:
      TICKET_ID: ${{ inputs.ticket_id }}
      SELECTED_TEST_CASES: ${{ inputs.test_case_ids }}

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # 4. DOWNLOAD GENERATED TEST CASES
      # ============================================================

      - name: Download generated test cases
        uses: actions/download-artifact@v4
        with:
          name: testcases-${{ inputs.ticket_id }}
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testcase_run_id }}

      # ============================================================
      # 5. VERIFY GENERATED TEST CASES
      # ============================================================

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "SELECTED TEST CASE AUTOMATION"
          echo "======================================"

          echo "Ticket: $TICKET_ID"
          echo "Selected test cases: $SELECTED_TEST_CASES"
          echo "Source generation run: ${{ inputs.testcase_run_id }}"

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Generated testcase files:"
          find data -maxdepth 2 -type f -print || true

          if [ ! -f "data/generated-testcases.json" ]; then
            echo ""
            echo "ERROR: generated-testcases.json not found."
            exit 1
          fi

          echo ""
          echo "generated-testcases.json found."

      # ============================================================
      # 6. PREPARE ONLY SELECTED TEST CASES
      # ============================================================

      - name: Prepare selected test cases
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const sourceFile = "data/generated-testcases.json";
          const outputFile = "data/selected-testcases.json";

          const data = JSON.parse(
            fs.readFileSync(sourceFile, "utf8")
          );

          if (!Array.isArray(data.testCases)) {
            console.error(
              "ERROR: generated-testcases.json does not contain testCases[]."
            );
            process.exit(1);
          }

          const selectedIds = process.env.SELECTED_TEST_CASES
            .split(",")
            .map(id => id.trim().toUpperCase())
            .filter(Boolean);

          if (selectedIds.length === 0) {
            console.error("ERROR: No selected test case IDs were provided.");
            process.exit(1);
          }

          const selected = data.testCases.filter(tc =>
            selectedIds.includes(String(tc.id).trim().toUpperCase())
          );

          const foundIds = new Set(
            selected.map(tc => String(tc.id).trim().toUpperCase())
          );

          const missingIds = selectedIds.filter(
            id => !foundIds.has(id)
          );

          if (missingIds.length > 0) {
            console.error(
              `ERROR: These selected test cases were not found: ${missingIds.join(", ")}`
            );
            process.exit(1);
          }

          const output = {
            ticketId: data.ticketId,
            ticketTitle: data.ticketTitle,
            selectedTestCases: selected
          };

          fs.writeFileSync(
            outputFile,
            JSON.stringify(output, null, 2)
          );

          console.log("");
          console.log("======================================");
          console.log("SELECTED TEST CASES");
          console.log("======================================");

          console.log(
            `Selected ${selected.length} test case(s).`
          );

          selected.forEach(tc => {
            console.log(
              `${tc.id} | ${tc.category || "UNCATEGORIZED"} | ${tc.title}`
            );
          });

          console.log("");
          console.log(`Created ${outputFile}`);
          NODE

      # ============================================================
      # 7. INSTALL CLAUDE CODE
      # ============================================================

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 8. VERIFY CLAUDE CODE
      # ============================================================

      - name: Verify Claude Code
        run: |
          claude --version

      # ============================================================
      # 9. SAVE BASELINE
      #
      # This lets us identify exactly what Claude changed.
      # ============================================================

      - name: Save repository baseline
        run: |
          git status --short > /tmp/baseline-status.txt

          git diff -- \
            tests \
            pages \
            locators \
            utils \
            fixture \
            data \
            playwright.config.js \
            package.json \
            > /tmp/baseline-diff.txt || true

          echo "Baseline captured."

      # ============================================================
      # 10. CLAUDE IMPLEMENTATION
      #
      # Claude ONLY writes the selected automation.
      # It does not own Git or PR creation.
      # ============================================================

      - name: Claude - implement selected test cases
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e

          cat > /tmp/claude-implementation-prompt.txt <<'PROMPT'
          You are the implementation agent for an existing Playwright automation repository.

          Your job is to AUTOMATE ONLY the test cases contained in:

          data/selected-testcases.json

          Do not automate anything else.

          ============================================================
          SOURCE OF TRUTH
          ============================================================

          Read:

          1. data/current-ticket-context.json
          2. data/selected-testcases.json

          The selected test cases are the ONLY tests you are authorized
          to implement.

          ============================================================
          REPOSITORY FIRST
          ============================================================

          Before writing code, inspect the existing automation framework.

          Identify and reuse:

          - existing tests
          - page objects
          - locator files
          - utilities
          - fixtures
          - data files
          - authentication/session handling
          - existing Draw Reporting automation
          - existing naming conventions
          - existing assertion patterns
          - existing logging patterns
          - existing self-healing locator patterns

          Do not redesign the framework.

          Do not introduce a new testing architecture.

          Do not create duplicate page objects or utilities when an
          existing implementation can be reused.

          ============================================================
          AUTOMATION RULES
          ============================================================

          1. Implement ONLY the selected test case IDs.

          2. Do not implement unselected test cases.

          3. Do not generate additional tests just because they appear useful.

          4. Use Playwright.

          5. Use the Playwright MCP/browser when browser exploration,
             locator discovery or application verification is necessary.

          6. Do not invent application behavior.

          7. Use the ticket context and selected testcase descriptions
             as the functional source of truth.

          8. Reuse existing page objects and locators wherever possible.

          9. If a new page object is genuinely required, follow the
             repository's existing page-object structure.

          10. If a new locator file is genuinely required, follow the
              repository's existing locator structure.

          11. Follow the repository's existing healingLocator patterns.

          12. Use existing Logger/test.step patterns.

          13. Use existing authentication/session state mechanisms.

          14. Avoid arbitrary waits and unnecessary timeouts.

          15. Prefer Playwright's built-in waiting mechanisms.

          16. Do not modify unrelated existing tests.

          17. Do not modify application/source code unless the selected
              testcase genuinely requires it and the repository already
              follows that practice.

          18. Do not delete existing tests.

          19. Do not rename unrelated files.

          ============================================================
          IMPORTANT: TEST ID MAPPING
          ============================================================

          Preserve the selected testcase IDs in the generated test names
          or comments so that the implementation can be traced back to
          the selected testcase.

          Example:

          TC001
          TC002

          must remain clearly identifiable.

          ============================================================
          IMPLEMENTATION STRATEGY
          ============================================================

          Work on the selected test cases one at a time.

          For each selected testcase:

          1. Understand the expected behavior.
          2. Find existing automation covering related functionality.
          3. Reuse existing code.
          4. Explore the application only where necessary.
          5. Implement the testcase.
          6. Check the generated code for syntax/structure problems.
          7. Move to the next selected testcase.

          Do not spend time implementing unrelated functionality.

          ============================================================
          VALIDATION
          ============================================================

          Before finishing:

          - Confirm every selected testcase has an implementation.
          - Confirm no unselected testcase was implemented.
          - Confirm generated JavaScript is syntactically valid.
          - Confirm imports point to real files.
          - Confirm referenced page objects and locators exist.
          - Confirm the implementation follows existing patterns.

          Run only the relevant generated tests if you can determine
          the correct Playwright commands safely.

          If a test fails, investigate the failure and fix the generated
          automation when the failure is caused by the implementation.

          Do not make unrelated changes.

          ============================================================
          GIT
          ============================================================

          DO NOT:

          - create a branch
          - git add
          - git commit
          - git push
          - create a pull request

          GitHub Actions handles all Git operations.

          ============================================================
          FINAL RESPONSE
          ============================================================

          At the end, provide a concise summary containing:

          - selected testcase IDs implemented
          - files created/modified
          - tests run
          - test results
          - any remaining issue

          PROMPT

          claude \
            --permission-mode acceptEdits \
            -p "$(cat /tmp/claude-implementation-prompt.txt)" \
            2>&1 | tee /tmp/claude-implementation.log

          CLAUDE_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "Claude implementation exit code: $CLAUDE_EXIT"

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "WARNING: Claude implementation returned non-zero."
            echo "We will inspect the repository before deciding whether"
            echo "the implementation is actually unusable."
          fi

          exit 0

      # ============================================================
      # 11. SHOW CLAUDE OUTPUT
      # ============================================================

      - name: Show Claude implementation result
        if: always()
        run: |
          echo "======================================"
          echo "CLAUDE IMPLEMENTATION LOG"
          echo "======================================"

          if [ -f /tmp/claude-implementation.log ]; then
            cat /tmp/claude-implementation.log
          else
            echo "No Claude log was generated."
          fi

      # ============================================================
      # 12. DETECT GENERATED CHANGES
      # ============================================================

      - name: Inspect generated automation changes
        run: |
          echo "======================================"
          echo "AUTOMATION CHANGES"
          echo "======================================"

          git status --short

          echo ""
          echo "Changed files:"
          git diff --name-only

          echo ""
          echo "Untracked files:"
          git ls-files --others --exclude-standard

          if [ -z "$(git status --porcelain -- \
            tests \
            pages \
            locators \
            utils \
            fixture \
            data \
            playwright.config.js \
            package.json)" ]; then

            echo ""
            echo "ERROR: Claude did not generate any automation changes."
            echo ""
            echo "Last Claude output:"
            tail -n 100 /tmp/claude-implementation.log || true

            exit 1
          fi

      # ============================================================
      # 13. SYNTAX VALIDATION
      # ============================================================

      - name: Validate generated JavaScript
        run: |
          set -e

          echo "======================================"
          echo "VALIDATING JAVASCRIPT"
          echo "======================================"

          CHANGED_JS_FILES="$(
            {
              git diff --name-only -- '*.js'
              git ls-files --others --exclude-standard -- '*.js'
            } | sort -u
          )"

          if [ -z "$CHANGED_JS_FILES" ]; then
            echo "No changed JavaScript files found."
            exit 0
          fi

          echo "$CHANGED_JS_FILES"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo ""
            echo "Checking: $file"

            node --check "$file"
          done <<< "$CHANGED_JS_FILES"

          echo ""
          echo "JavaScript syntax validation passed."

      # ============================================================
      # 14. IDENTIFY SELECTED TEST FILES
      # ============================================================

      - name: Identify selected Playwright test files
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("data/selected-testcases.json", "utf8")
          );

          const ids = data.selectedTestCases.map(tc => tc.id);

          console.log("Selected testcase IDs:");
          console.log(ids.join(", "));

          /*
           * Store IDs for later steps.
           */
          fs.writeFileSync(
            "/tmp/selected-testcase-ids.txt",
            ids.join("\n")
          );
          NODE

          echo ""
          echo "Potential test files:"
          find tests -maxdepth 1 -type f -name "*.spec.js" -print | sort

      # ============================================================
      # 15. RUN PLAYWRIGHT
      #
      # We deliberately don't let this step immediately kill the job.
      # The failure output is needed by the repair agent.
      # ============================================================

      - name: Run generated Playwright tests
        id: playwright_initial
        continue-on-error: true
        run: |
          echo "======================================"
          echo "RUNNING GENERATED TEST AUTOMATION"
          echo "======================================"

          echo "Selected test cases:"
          cat /tmp/selected-testcase-ids.txt

          echo ""
          echo "NOTE:"
          echo "The workflow will determine the relevant generated test"
          echo "files from the repository implementation."

          echo ""

          set +e

          npx playwright test \
            --workers=1 \
            2>&1 | tee /tmp/playwright-initial.log

          PLAYWRIGHT_EXIT=${PIPESTATUS[0]}

          echo "$PLAYWRIGHT_EXIT" > /tmp/playwright-initial-exit-code.txt

          echo ""
          echo "Playwright exit code: $PLAYWRIGHT_EXIT"

          exit "$PLAYWRIGHT_EXIT"

      # ============================================================
      # 16. CLAUDE TARGETED REPAIR
      #
      # Only runs if Playwright failed.
      # ============================================================

      - name: Claude - repair failed automation
        if: steps.playwright_initial.outcome == 'failure'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "======================================"
          echo "CLAUDE TARGETED REPAIR"
          echo "======================================"

          echo "Playwright failure output:"
          tail -n 250 /tmp/playwright-initial.log || true

          cat > /tmp/claude-repair-prompt.txt <<'PROMPT'
          You are a targeted Playwright repair agent.

          The repository contains automation generated for selected
          test cases.

          Read:

          data/current-ticket-context.json
          data/selected-testcases.json

          The Playwright test run failed.

          The failure output is available at:

          /tmp/playwright-initial.log

          ============================================================
          YOUR JOB
          ============================================================

          Fix ONLY the automation necessary to resolve the Playwright
          failures for the selected test cases.

          Do not redesign the framework.

          Do not implement additional test cases.

          Do not modify unrelated tests.

          Do not modify unrelated application files.

          Do not create a new testing architecture.

          ============================================================
          DEBUGGING
          ============================================================

          1. Read the Playwright failure output.
          2. Identify the actual failing test.
          3. Map it back to the selected testcase.
          4. Inspect the relevant existing page object/locator/utilities.
          5. Fix the automation.
          6. Preserve the repository's existing patterns.
          7. Run the relevant failed test again if possible.

          Do not guess application behavior.

          Use the existing framework.

          ============================================================
          IMPORTANT
          ============================================================

          A Playwright failure caused by environment/application
          availability should NOT result in broad unrelated code changes.

          Only modify code when the failure is caused by the generated
          automation.

          ============================================================
          GIT
          ============================================================

          Do not create branches.

          Do not commit.

          Do not push.

          Do not create a PR.

          GitHub Actions handles Git operations.

          ============================================================
          FINAL RESPONSE
          ============================================================

          Report:

          - root cause
          - files changed
          - selected testcase affected
          - validation performed
          - remaining issue, if any

          PROMPT

          claude \
            --permission-mode acceptEdits \
            -p "$(cat /tmp/claude-repair-prompt.txt)" \
            2>&1 | tee /tmp/claude-repair.log

          REPAIR_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "Claude repair exit code: $REPAIR_EXIT"

          if [ "$REPAIR_EXIT" -ne 0 ]; then
            echo "WARNING: Claude repair returned non-zero."
          fi

      # ============================================================
      # 17. SECOND PLAYWRIGHT VALIDATION
      #
      # Only run after a repair attempt.
      # ============================================================

      - name: Run Playwright after repair
        if: steps.playwright_initial.outcome == 'failure'
        id: playwright_repair
        continue-on-error: true
        run: |
          echo "======================================"
          echo "PLAYWRIGHT VALIDATION AFTER REPAIR"
          echo "======================================"

          set +e

          npx playwright test \
            --workers=1 \
            2>&1 | tee /tmp/playwright-repair.log

          PLAYWRIGHT_EXIT=${PIPESTATUS[0]}

          echo "$PLAYWRIGHT_EXIT" > /tmp/playwright-repair-exit-code.txt

          echo ""
          echo "Playwright repair validation exit code: $PLAYWRIGHT_EXIT"

          exit "$PLAYWRIGHT_EXIT"

      # ============================================================
      # 18. FINAL AUTOMATION VALIDATION
      # ============================================================

      - name: Final automation validation
        run: |
          INITIAL_RESULT="${{ steps.playwright_initial.outcome }}"
          REPAIR_RESULT="${{ steps.playwright_repair.outcome }}"

          echo "======================================"
          echo "FINAL AUTOMATION RESULT"
          echo "======================================"

          echo "Initial Playwright result: $INITIAL_RESULT"
          echo "Repair Playwright result: $REPAIR_RESULT"

          if [ "$INITIAL_RESULT" = "success" ]; then
            echo ""
            echo "Playwright passed on the initial implementation."
            exit 0
          fi

          if [ "$REPAIR_RESULT" = "success" ]; then
            echo ""
            echo "Playwright passed after targeted Claude repair."
            exit 0
          fi

          echo ""
          echo "ERROR: Generated automation still fails after repair."

          echo ""
          echo "======================================"
          echo "INITIAL PLAYWRIGHT FAILURE"
          echo "======================================"

          tail -n 200 /tmp/playwright-initial.log || true

          echo ""
          echo "======================================"
          echo "REPAIR PLAYWRIGHT FAILURE"
          echo "======================================"

          tail -n 200 /tmp/playwright-repair.log || true

          exit 1

      # ============================================================
      # 19. SHOW FINAL DIFF
      # ============================================================

      - name: Show final automation diff
        run: |
          echo "======================================"
          echo "FINAL AUTOMATION DIFF"
          echo "======================================"

          git status --short

          echo ""
          echo "Modified tracked files:"
          git diff --name-only

          echo ""
          echo "Untracked files:"
          git ls-files --others --exclude-standard

          echo ""
          echo "Diff statistics:"
          git diff --stat

      # ============================================================
      # 20. CREATE BRANCH AND PR
      # ============================================================

      - name: Create branch and PR
        env:
          BRANCH: ai/${{ inputs.ticket_id }}-selected-tests
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "CREATING AUTOMATION PR"
          echo "======================================"

          if [ -z "$(git status --porcelain -- \
            tests \
            pages \
            locators \
            utils \
            fixture \
            data \
            playwright.config.js \
            package.json)" ]; then

            echo "ERROR: No automation changes were generated."
            exit 1
          fi

          git config user.name "tailorbird-ai-agent[bot]"
          git config user.email "tailorbird-ai-agent[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git branch -D "$BRANCH"
          fi

          git checkout -b "$BRANCH"

          # Only add automation-related changes.
          #
          # This prevents unrelated local/generated repository changes
          # from being included in the PR.

          git add \
            tests/ \
            pages/ \
            locators/ \
            utils/ \
            fixture/ \
            data/ \
            playwright.config.js \
            package.json \
            package-lock.json

          if git diff --cached --quiet; then
            echo "ERROR: Nothing to commit after staging automation files."
            exit 1
          fi

          echo ""
          echo "Staged files:"
          git diff --cached --name-only

          SUMMARY="$(git diff --cached --stat)"

          git commit \
            -m "AI-generated selected tests for ${{ inputs.ticket_id }}"

          git push --force-with-lease origin "$BRANCH"

          # If the branch already has an open PR, update it instead
          # of creating another one.

          EXISTING_PR="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$EXISTING_PR" ]; then
            echo ""
            echo "Existing PR found: #$EXISTING_PR"
            echo "Branch updated successfully."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --title "AI-generated selected tests for ${{ inputs.ticket_id }}" \
            --body "## AI Test Automation

          **Ticket:** ${{ inputs.ticket_id }}

          **Selected test cases:**
          ${{ inputs.test_case_ids }}

          **Generation run:**
          ${{ inputs.testcase_run_id }}

          ## Validation

          Playwright automation was generated and validated by the AI automation workflow.

          ## Files changed

          $SUMMARY" \
            --base main \
            --head "$BRANCH"

      # ============================================================
      # 21. UPLOAD DEBUG ARTIFACTS
      #
      # Useful if Claude/Playwright fails.
      # ============================================================

      - name: Upload automation debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-automation-debug-${{ inputs.ticket_id }}
          if-no-files-found: ignore
          path: |
            /tmp/claude-implementation.log
            /tmp/claude-repair.log
            /tmp/playwright-initial.log
            /tmp/playwright-repair.log
            data/selected-testcases.json