name: AI Automate Selected Test Cases

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Ticket ID"
        required: true
        type: string

      test_case_ids:
        description: "Selected test case IDs (comma-separated)"
        required: true
        type: string

      testcase_run_id:
        description: "GitHub run ID containing generated test cases"
        required: true
        type: string

jobs:
  automate-selected-testcases:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download generated test cases
        uses: actions/download-artifact@v4
        with:
          name: testcases-${{ inputs.ticket_id }}
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.testcase_run_id }}

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "SELECTED TEST CASE AUTOMATION"
          echo "======================================"

          echo "Ticket: ${{ inputs.ticket_id }}"
          echo "Selected test cases: ${{ inputs.test_case_ids }}"
          echo "Source run: ${{ inputs.testcase_run_id }}"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json not found."
            exit 1
          fi

          echo ""
          echo "Generated test cases:"
          cat data/generated-testcases.json

      - name: Prepare selected test cases
        env:
          SELECTED_TEST_CASES: ${{ inputs.test_case_ids }}
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const file = "data/generated-testcases.json";

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const selectedIds = process.env.SELECTED_TEST_CASES
            .split(",")
            .map(id => id.trim())
            .filter(Boolean);

          const selected = data.testCases.filter(tc =>
            selectedIds.includes(tc.id)
          );

          if (selected.length === 0) {
            console.error("ERROR: No matching test cases found.");
            process.exit(1);
          }

          const output = {
            ticketId: data.ticketId,
            ticketTitle: data.ticketTitle,
            selectedTestCases: selected
          };

          fs.writeFileSync(
            "data/selected-testcases.json",
            JSON.stringify(output, null, 2)
          );

          console.log(
            `Selected ${selected.length} test case(s).`
          );

          selected.forEach(tc => {
            console.log(`- ${tc.id} | ${tc.title}`);
          });
          NODE

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code
        run: |
          claude --version

      - name: Automate selected test cases
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude \
            --permission-mode acceptEdits \
            -p "$(cat <<'EOF'

          Read these files:

          data/current-ticket-context.json
          data/selected-testcases.json

          Your task is to AUTOMATE ONLY THE SELECTED TEST CASES.

          ============================================================
          IMPORTANT
          ============================================================

          The user has explicitly selected specific test cases.

          You MUST automate ONLY the test cases contained in:

          data/selected-testcases.json

          DO NOT automate any other test cases from the ticket.

          ============================================================
          AUTOMATION REQUIREMENTS
          ============================================================

          1. Inspect the existing Playwright automation framework.

          2. Follow the existing framework structure, naming conventions,
             fixtures, helpers, locators, login/session handling and patterns.

          3. Use Playwright.

          4. Use the Playwright MCP browser when browser interaction,
             exploration, verification or locator discovery is required.

          5. Do not invent application behavior.

          6. Use the ticket context and selected test cases as the source
             of truth.

          7. Implement positive, negative, edge, visual/UI and E2E scenarios
             only when they are explicitly present in the selected test cases.

          8. Do not implement test cases that were not selected.

          9. Do not modify unrelated existing tests.

          10. Do not modify unrelated application files.

          11. Reuse existing utilities and page objects whenever possible.

          12. Follow the repository's existing Playwright and Semgrep-safe
              locator practices.

          13. Avoid unnecessary waits.

          14. Prefer proper Playwright waiting mechanisms.

          15. Do not use regex locators if the repository's existing rules
              prohibit them.

          ============================================================
          BEFORE FINISHING
          ============================================================

          Verify:

          - Only selected test cases were automated.
          - The generated test files are valid.
          - Existing unrelated tests were not modified.
          - The implementation follows the existing framework structure.
          - The tests are actually runnable.

          Run the relevant generated tests if possible.

          Do NOT create a PR yourself.
          Do NOT create a branch yourself.
          Do NOT commit anything yourself.

          The GitHub workflow will handle the branch and PR.

          ============================================================

          EOF
          )"

      - name: Create branch and PR
        env:
          BRANCH: ai/${{ inputs.ticket_id }}-selected-tests
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- tests/)" ]; then
            echo "ERROR: No test automation was generated."
            exit 1
          fi

          git config user.name "tailorbird-ai-agent[bot]"
          git config user.email "tailorbird-ai-agent[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add tests/

          SUMMARY="$(git diff --stat --cached)"

          git commit \
            -m "AI-generated selected tests for ${{ inputs.ticket_id }}"

          git push origin "$BRANCH"

          gh pr create \
            --title "AI-generated selected tests for ${{ inputs.ticket_id }}" \
            --body "Ticket: ${{ inputs.ticket_id }}

          Selected test cases:
          ${{ inputs.test_case_ids }}

          Files changed:

          $SUMMARY" \
            --base main \
            --head "$BRANCH"