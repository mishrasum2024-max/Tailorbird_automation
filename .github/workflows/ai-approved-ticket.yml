name: AI Approved Ticket

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

      selected_test_cases:
        description: "Selected test case IDs"
        required: true
        type: string

      generation_run_id:
        description: "AI test-case generation workflow run ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  process-approved-ticket:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show approved selection
        run: |
          echo "======================================"
          echo "AI TEST CASES APPROVED"
          echo "======================================"
          echo "Ticket ID:"
          echo "${{ inputs.ticket_id }}"
          echo ""
          echo "Selected Test Cases:"
          echo "${{ inputs.selected_test_cases }}"
          echo ""
          echo "Generation Run ID:"
          echo "${{ inputs.generation_run_id }}"
          echo ""
          echo "Expected Artifact:"
          echo "generated-testcases"
          echo "======================================"

      - name: Download generated test cases
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          echo "======================================"
          echo "DOWNLOADING GENERATED TEST CASES"
          echo "======================================"
          ARTIFACT_NAME="generated-testcases"
          echo "Generation Run ID:"
          echo "$GENERATION_RUN_ID"
          echo ""
          echo "Artifact Name:"
          echo "$ARTIFACT_NAME"
          echo ""
          mkdir -p data/generated-testcases-artifact
          gh run download "$GENERATION_RUN_ID" --repo "${{ github.repository }}" --name "$ARTIFACT_NAME" --dir data/generated-testcases-artifact
          echo ""
          echo "Downloaded files:"
          find data/generated-testcases-artifact -maxdepth 3 -type f -print
          echo ""
          if [ ! -f "data/generated-testcases-artifact/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json was not found in the artifact."
            echo ""
            echo "Expected artifact:"
            echo "$ARTIFACT_NAME"
            echo ""
            echo "Generation run:"
            echo "$GENERATION_RUN_ID"
            echo ""
            echo "Downloaded files:"
            find data/generated-testcases-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          cp data/generated-testcases-artifact/generated-testcases.json data/generated-testcases.json
          echo ""
          echo "✅ generated-testcases.json ready."

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"
          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json not found."
            exit 1
          fi
          echo "Generated test cases file found."
          echo ""
          echo "Ticket:"
          node -e "const data = require('./data/generated-testcases.json'); console.log(data.ticketId);"
          echo ""
          echo "Total generated test cases:"
          node -e "const data = require('./data/generated-testcases.json'); console.log(data.testCases?.length || 0);"
          echo ""
          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"
          node -e "
            const data = require('./data/generated-testcases.json');
            for (const tc of data.testCases || []) {
              console.log(tc.id + ' | ' + (tc.category || tc.testType || 'UNCATEGORIZED') + ' | ' + tc.title);
            }
          "

      - name: Filter selected test cases
        env:
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
        run: |
          echo "======================================"
          echo "FILTERING SELECTED TEST CASES"
          echo "======================================"
          echo "Selected IDs:"
          echo "$SELECTED_TEST_CASES"
          echo ""
          node scripts/ai-agent/filter-selected-testcases.js
          echo ""
          echo "======================================"
          echo "SELECTED TEST CASES FILE"
          echo "======================================"
          cat data/selected-testcases.json

      - name: Verify selected test cases
        run: |
          echo "======================================"
          echo "VERIFYING SELECTED TEST CASES"
          echo "======================================"
          node - <<'NODE'
          const fs = require("fs");
          const file = "data/selected-testcases.json";
          if (!fs.existsSync(file)) {
            console.error("ERROR: selected-testcases.json was not created.");
            process.exit(1);
          }
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          const selected = data.selectedTestCases || [];
          console.log(`Selected count: ${selected.length}`);
          if (!selected.length) {
            console.error("ERROR: No test cases were selected.");
            process.exit(1);
          }
          console.log("");
          selected.forEach((tc) => {
            console.log(`${tc.id} | ${tc.category || tc.testType || "UNCATEGORIZED"} | ${tc.title}`);
          });
          console.log("");
          console.log("✅ Selected test cases verified.");
          NODE

      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      - name: Prepare Claude test-generation prompt
        env:
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          node scripts/prepare-claude-test.js

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code
        run: |
          claude --version

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate authenticated session for Claude
        id: generate_session
        continue-on-error: true
        timeout-minutes: 3
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
          NEW_TEST_EMAIL: ${{ secrets.NEW_TEST_EMAIL }}
          NEW_TEST_PASSWORD: ${{ secrets.NEW_TEST_PASSWORD }}
          ONE_ORG_TEST_EMAIL: ${{ secrets.ONE_ORG_TEST_EMAIL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          echo "======================================"
          echo "GENERATING AUTHENTICATED SESSION"
          echo "======================================"
          npx playwright test tests/TC01_login.spec.js --grep "TC01 |TC03 |TC04 " --workers=1 --reporter=list
          if [ -f sessionState.json ]; then
            echo "✅ sessionState.json created."
          else
            echo "⚠️ sessionState.json was not created. Claude will log in manually."
          fi

      - name: Configure Playwright MCP for this run
        run: |
          if [ -f sessionState.json ]; then
            cat > .mcp.json << 'EOF'
          {
            "mcpServers": {
              "playwright": {
                "command": "npx",
                "args": ["-y", "@playwright/mcp@latest", "--headless", "--storage-state", "sessionState.json"]
              }
            }
          }
          EOF
            echo "Configured Playwright MCP with pre-authenticated session."
          else
            cat > .mcp.json << 'EOF'
          {
            "mcpServers": {
              "playwright": {
                "command": "npx",
                "args": ["-y", "@playwright/mcp@latest", "--headless"]
              }
            }
          }
          EOF
            echo "Configured Playwright MCP without pre-authenticated session."
          fi
          cat .mcp.json

      - name: Save repository baseline
        run: |
          git status --short > /tmp/baseline-status.txt
          git diff -- tests pages locators utils fixture data playwright.config.js package.json > /tmp/baseline-diff.txt || true
          echo "Baseline captured."

      - name: Generate Playwright tests with Claude Code
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
          NEW_TEST_EMAIL: ${{ secrets.NEW_TEST_EMAIL }}
          NEW_TEST_PASSWORD: ${{ secrets.NEW_TEST_PASSWORD }}
          ONE_ORG_TEST_EMAIL: ${{ secrets.ONE_ORG_TEST_EMAIL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set +e
          claude --permission-mode acceptEdits --max-turns 80 --allowedTools "Bash,Edit,Write,mcp__playwright__*" --mcp-config .mcp.json -p "$(cat data/claude-test-generation-prompt.md)" 2>&1 | tee /tmp/claude-test-generation.log
          CLAUDE_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "Claude test-generation exit code: $CLAUDE_EXIT"
          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "WARNING: Claude test generation returned non-zero."
            echo "We will inspect the repository before deciding whether"
            echo "the run actually failed to produce anything usable."
          fi
          exit 0

      - name: Show Claude test-generation log
        if: always()
        run: |
          echo "======================================"
          echo "CLAUDE TEST-GENERATION LOG"
          echo "======================================"
          if [ -f /tmp/claude-test-generation.log ]; then
            cat /tmp/claude-test-generation.log
          else
            echo "No Claude log was generated."
          fi

      - name: Check for generated test changes
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain -- tests/)" ]; then
            echo "No test file changes were produced by Claude Code."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Test file changes found:"
            git status --short -- tests/
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mandatory tests, then newly added test case(s)
        id: run_generated_tests
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
          NEW_TEST_EMAIL: ${{ secrets.NEW_TEST_EMAIL }}
          NEW_TEST_PASSWORD: ${{ secrets.NEW_TEST_PASSWORD }}
          ONE_ORG_TEST_EMAIL: ${{ secrets.ONE_ORG_TEST_EMAIL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/new-tests-result.json
        run: |
          set +e
          echo "======================================"
          echo "STEP A: MANDATORY TESTS (regression check)"
          echo "======================================"
          npx playwright test --grep "@mandatory" --workers=1 --reporter=list 2>&1 | tee /tmp/mandatory-tests-result.log
          MANDATORY_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "Mandatory tests exit code: $MANDATORY_EXIT"
          echo ""
          echo "======================================"
          echo "STEP B: NEWLY ADDED TEST CASE(S) ONLY"
          echo "======================================"
          CHANGED_SPECS="$(git status --porcelain -- tests/ | awk '{print $2}')"
          if [ -z "$CHANGED_SPECS" ]; then
            echo "No spec files changed. Nothing new to run."
            NEW_EXIT=1
            NEW_STATUS="skipped"
          else
            echo "Changed spec files:"
            echo "$CHANGED_SPECS"
            GREP_PATTERN="$(echo "$SELECTED_TEST_CASES" | sed 's/,/|/g')"
            echo ""
            echo "Running only: $GREP_PATTERN"
            echo ""
            npx playwright test $CHANGED_SPECS --grep "$GREP_PATTERN" --workers=1 --reporter=list,json 2>&1 | tee /tmp/new-tests-result.log
            NEW_EXIT=${PIPESTATUS[0]}
            NEW_STATUS="ran"
            echo ""
            echo "Summarizing per-test-case results..."
            RESULTS_FILE=/tmp/new-tests-result.json SELECTED_TEST_CASES="$SELECTED_TEST_CASES" node scripts/ai-agent/summarize-test-results.js
          fi
          echo ""
          echo "New test case(s) exit code: $NEW_EXIT"
          if [ "$MANDATORY_EXIT" -ne 0 ]; then
            FINAL_TEST_STATUS="mandatory_failed"
          elif [ "$NEW_STATUS" = "skipped" ]; then
            FINAL_TEST_STATUS="skipped"
          elif [ "$NEW_EXIT" -eq 0 ]; then
            FINAL_TEST_STATUS="passed"
          else
            FINAL_TEST_STATUS="failed"
          fi
          echo ""
          echo "======================================"
          echo "RESOLVED test_status = $FINAL_TEST_STATUS"
          echo "======================================"
          echo "test_status=$FINAL_TEST_STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show test_status feeding into repair decision
        if: always()
        run: |
          echo "has_changes  = ${{ steps.check_changes.outputs.has_changes }}"
          echo "test_status  = ${{ steps.run_generated_tests.outputs.test_status }}"
          echo "Repair step will run only if has_changes == 'true' AND test_status == 'failed'."

      - name: Repair failing new test case(s) via live browser
        id: repair_tests
        if: steps.check_changes.outputs.has_changes == 'true' && steps.run_generated_tests.outputs.test_status == 'failed'
        timeout-minutes: 35
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
          NEW_TEST_EMAIL: ${{ secrets.NEW_TEST_EMAIL }}
          NEW_TEST_PASSWORD: ${{ secrets.NEW_TEST_PASSWORD }}
          ONE_ORG_TEST_EMAIL: ${{ secrets.ONE_ORG_TEST_EMAIL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          TICKET_ID: ${{ inputs.ticket_id }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/new-tests-result.json
          INITIAL_PASSED_IDS: ${{ steps.run_generated_tests.outputs.passed_ids }}
          INITIAL_FAILED_IDS: ${{ steps.run_generated_tests.outputs.failed_ids }}
        run: |
          set +e
          echo "Repair step is running."
          MAX_REPAIR_ATTEMPTS=4
          ATTEMPTS_USED=0
          PASSED_IDS="$INITIAL_PASSED_IDS"
          FAILED_IDS="$INITIAL_FAILED_IDS"
          ALL_PASSED="false"
          CHANGED_SPECS="$(git status --porcelain -- tests/ | awk '{print $2}')"
          FULL_GREP_PATTERN="$(echo "$SELECTED_TEST_CASES" | sed 's/,/|/g')"
          echo "Initially passing: $PASSED_IDS"
          echo "Initially failing: $FAILED_IDS"
          for ATTEMPT in $(seq 1 "$MAX_REPAIR_ATTEMPTS"); do
            ATTEMPTS_USED=$ATTEMPT
            if [ -z "$FAILED_IDS" ]; then
              echo "No failing test case IDs to target - stopping early."
              break
            fi
            echo "======================================"
            echo "REPAIR ATTEMPT $ATTEMPT / $MAX_REPAIR_ATTEMPTS"
            echo "Targeting: $FAILED_IDS"
            echo "======================================"
            export ATTEMPT
            export MAX_REPAIR_ATTEMPTS
            export FAILED_TEST_CASES="$FAILED_IDS"
            export PASSED_TEST_CASES="$PASSED_IDS"
            node scripts/ai-agent/prepare-repair-prompt.js
            REPAIR_PROMPT="$(cat data/claude-repair-prompt.md)"
            claude --permission-mode acceptEdits --max-turns 40 --allowedTools "Bash,Edit,Write,mcp__playwright__*" --mcp-config .mcp.json -p "$REPAIR_PROMPT" > "/tmp/repair-attempt-$ATTEMPT.log" 2>&1
            cat "/tmp/repair-attempt-$ATTEMPT.log"
            echo ""
            echo "Re-running ALL selected test case(s) after repair attempt $ATTEMPT..."
            npx playwright test $CHANGED_SPECS --grep "$FULL_GREP_PATTERN" --workers=1 --reporter=list,json > /tmp/new-tests-result.log 2>&1
            cat /tmp/new-tests-result.log
            RESULTS_FILE=/tmp/new-tests-result.json SELECTED_TEST_CASES="$SELECTED_TEST_CASES" node scripts/ai-agent/summarize-test-results.js
            source /tmp/test-summary.env
            if [ "$ALL_PASSED" = "true" ]; then
              echo "All selected test case(s) passing after repair attempt $ATTEMPT."
              break
            fi
            echo "Still failing after repair attempt $ATTEMPT: $FAILED_IDS"
          done
          if [ "$ALL_PASSED" = "true" ]; then
            echo "final_test_status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "final_test_status=failed" >> "$GITHUB_OUTPUT"
          fi
          echo "repair_attempts=$ATTEMPTS_USED" >> "$GITHUB_OUTPUT"
          echo "final_passed_ids=$PASSED_IDS" >> "$GITHUB_OUTPUT"
          echo "final_failed_ids=$FAILED_IDS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload generated-test run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-approved-ticket-playwright-report-${{ inputs.ticket_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            /tmp/mandatory-tests-result.log
            /tmp/new-tests-result.log
            /tmp/repair-attempt-*.log

      - name: Verify test architecture compliance
        id: verify_architecture
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          node scripts/ai-agent/verify-test-architecture.js 2>&1 | tee /tmp/architecture-check.log
          STATUS_LINE="$(grep -o 'architecture_status=[a-z]*' /tmp/architecture-check.log | tail -n 1)"
          if [ -n "$STATUS_LINE" ]; then
            echo "$STATUS_LINE" >> "$GITHUB_OUTPUT"
          else
            echo "architecture_status=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated tests and open a PR
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.repair_tests.outputs.final_test_status || steps.run_generated_tests.outputs.test_status }}
          REPAIR_ATTEMPTS: ${{ steps.repair_tests.outputs.repair_attempts }}
          PASSED_TEST_CASES: ${{ steps.repair_tests.outputs.final_passed_ids || steps.run_generated_tests.outputs.passed_ids }}
          FAILED_TEST_CASES: ${{ steps.repair_tests.outputs.final_failed_ids || steps.run_generated_tests.outputs.failed_ids }}
          ARCHITECTURE_STATUS: ${{ steps.verify_architecture.outputs.architecture_status }}
        run: |
          BRANCH="ai/${{ inputs.ticket_id }}-tests"
          echo "======================================"
          echo "CHECKING GENERATED PLAYWRIGHT TESTS"
          echo "======================================"
          git config user.name "tailorbird-ai-agent[bot]"
          git config user.email "tailorbird-ai-agent[bot]@users.noreply.github.com"
          echo "Full working-tree status:"
          git status --short
          echo ""
          echo "Untracked files:"
          git ls-files --others --exclude-standard
          if [ -z "$(git status --porcelain -- tests/)" ]; then
            echo ""
            echo "No test file changes were produced by Claude Code."
            echo ""
            echo "Last Claude output:"
            tail -n 100 /tmp/claude-test-generation.log || true
            echo ""
            echo "Skipping PR creation."
            echo "pr_status=skipped" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo ""
          echo "Test files changed:"
          git status --short -- tests/
          echo ""
          echo "======================================"
          echo "CREATING AI TEST AUTOMATION BRANCH"
          echo "======================================"
          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git branch -D "$BRANCH"
          fi
          git checkout -b "$BRANCH"
          git add tests/
          SUMMARY="$(git diff --stat --cached)"
          echo ""
          echo "Changes:"
          echo "$SUMMARY"
          git commit -m "AI-generated Playwright tests for ${{ inputs.ticket_id }}"
          git push --force-with-lease origin "$BRANCH"
          echo ""
          echo "======================================"
          echo "CREATING PULL REQUEST"
          echo "======================================"
          EXISTING_PR_URL="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$EXISTING_PR_URL" ]; then
            echo ""
            echo "Existing PR found: $EXISTING_PR_URL"
            echo "Branch updated successfully."
            echo "pr_status=updated" >> "$GITHUB_OUTPUT"
            echo "pr_url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEEDS_REVIEW=""
          case "$TEST_STATUS" in
            passed)
              if [ -n "$REPAIR_ATTEMPTS" ] && [ "$REPAIR_ATTEMPTS" -gt 0 ] 2>/dev/null; then
                TEST_LINE="✅ Mandatory tests passed. New test case FAILED initially but was auto-fixed and PASSED after $REPAIR_ATTEMPTS live-browser repair attempt(s)."
              else
                TEST_LINE="✅ Mandatory tests + new test case(s) PASSED against the live app."
              fi
              ;;
            mandatory_failed)
              TEST_LINE="🚨 MANDATORY (regression) tests FAILED. This change may have broken existing functionality."
              NEEDS_REVIEW="yes"
              ;;
            failed)
              if [ -n "$REPAIR_ATTEMPTS" ] && [ "$REPAIR_ATTEMPTS" -gt 0 ] 2>/dev/null; then
                TEST_LINE="❌ New test case still FAILED after $REPAIR_ATTEMPTS automatic live-browser repair attempt(s). Needs manual investigation."
              else
                TEST_LINE="❌ New test case(s) FAILED against the live app."
              fi
              NEEDS_REVIEW="yes"
              ;;
            *)
              TEST_LINE="⚠️ Tests were not run (skipped)."
              NEEDS_REVIEW="yes"
              ;;
          esac
          case "$ARCHITECTURE_STATUS" in
            clean)
              ARCH_LINE="✅ No raw locator/page usage found in spec files."
              ;;
            violations)
              ARCH_LINE="⚠️ Spec file(s) appear to bypass page objects — see workflow log for details."
              NEEDS_REVIEW="yes"
              ;;
            *)
              ARCH_LINE="⚠️ Architecture check did not run or was inconclusive."
              NEEDS_REVIEW="yes"
              ;;
          esac
          RESULTS_LINE=""
          if [ -n "$PASSED_TEST_CASES" ]; then
            RESULTS_LINE="${RESULTS_LINE}✅ Passed: ${PASSED_TEST_CASES}"$'\n'
          fi
          if [ -n "$FAILED_TEST_CASES" ]; then
            RESULTS_LINE="${RESULTS_LINE}❌ Failed: ${FAILED_TEST_CASES}"$'\n'
          fi
          if [ -n "$NEEDS_REVIEW" ]; then
            DRAFT_FLAG="--draft"
            TITLE_PREFIX="[NEEDS REVIEW]"
          else
            DRAFT_FLAG=""
            TITLE_PREFIX="[Verified]"
          fi
          PR_URL="$(gh pr create --title "$TITLE_PREFIX AI-generated tests for ${{ inputs.ticket_id }}" --body "Ticket: ${{ inputs.ticket_id }}"$'\n\n'"$TEST_LINE"$'\n'"$ARCH_LINE"$'\n\n'"$RESULTS_LINE"$'\n'"Selected test cases: ${{ inputs.selected_test_cases }}"$'\n\n'"Generation run ID: ${{ inputs.generation_run_id }}"$'\n\n'"Files changed:"$'\n'"$SUMMARY" --base main --head "$BRANCH" $DRAFT_FLAG)"
          echo ""
          echo "✅ Pull request created: $PR_URL"
          echo "pr_status=created" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about PR status
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          PR_STATUS: ${{ steps.create_pr.outputs.pr_status }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          TEST_STATUS: ${{ steps.repair_tests.outputs.final_test_status || steps.run_generated_tests.outputs.test_status }}
          REPAIR_ATTEMPTS: ${{ steps.repair_tests.outputs.repair_attempts }}
          PASSED_TEST_CASES: ${{ steps.repair_tests.outputs.final_passed_ids || steps.run_generated_tests.outputs.passed_ids }}
          FAILED_TEST_CASES: ${{ steps.repair_tests.outputs.final_failed_ids || steps.run_generated_tests.outputs.failed_ids }}
          ARCHITECTURE_STATUS: ${{ steps.verify_architecture.outputs.architecture_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/ai-agent/notify-slack-pr-status.js

      - name: Upload automation debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-approved-ticket-debug-${{ inputs.ticket_id }}
          if-no-files-found: ignore
          path: |
            /tmp/claude-test-generation.log
            /tmp/baseline-status.txt
            /tmp/baseline-diff.txt
            /tmp/architecture-check.log
            /tmp/repair-attempt-*.log
            /tmp/new-tests-result.json
            data/test-failure-details.json
            data/claude-test-generation-prompt.md
            data/claude-repair-prompt.md
            data/selected-testcases.json