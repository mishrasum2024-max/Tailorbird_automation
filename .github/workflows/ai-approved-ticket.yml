name: AI Approved Ticket

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "Approved Notion ticket ID"
        required: true
        type: string

      selected_test_cases:
        description: "Selected test case IDs"
        required: true
        type: string

      generation_run_id:
        description: "AI test-case generation workflow run ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  process-approved-ticket:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Show approval information
      # --------------------------------------------------

      - name: Show approved selection
        run: |
          echo "======================================"
          echo "AI TEST CASES APPROVED"
          echo "======================================"

          echo "Ticket ID:"
          echo "${{ inputs.ticket_id }}"

          echo ""

          echo "Selected Test Cases:"
          echo "${{ inputs.selected_test_cases }}"

          echo ""

          echo "Generation Run ID:"
          echo "${{ inputs.generation_run_id }}"

          echo ""

          echo "Expected Artifact:"
          echo "generated-testcases"

          echo "======================================"

      # --------------------------------------------------
      # 5. Download generated test cases
      #
      # IMPORTANT:
      # ai-generate-testcases.yml uploads the artifact as:
      #
      # generated-testcases
      #
      # DO NOT change this to testcases-${ticket_id}
      # --------------------------------------------------

      - name: Download generated test cases
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          echo "======================================"
          echo "DOWNLOADING GENERATED TEST CASES"
          echo "======================================"

          ARTIFACT_NAME="generated-testcases"

          echo "Generation Run ID:"
          echo "$GENERATION_RUN_ID"

          echo ""

          echo "Artifact Name:"
          echo "$ARTIFACT_NAME"

          echo ""

          mkdir -p data/generated-testcases-artifact

          gh run download "$GENERATION_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" \
            --dir data/generated-testcases-artifact

          echo ""
          echo "Downloaded files:"

          find data/generated-testcases-artifact \
            -maxdepth 3 \
            -type f \
            -print

          echo ""

          if [ ! -f "data/generated-testcases-artifact/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json was not found in the artifact."
            echo ""

            echo "Expected artifact:"
            echo "$ARTIFACT_NAME"

            echo ""

            echo "Generation run:"
            echo "$GENERATION_RUN_ID"

            echo ""

            echo "Downloaded files:"
            find data/generated-testcases-artifact \
              -maxdepth 3 \
              -type f \
              -print

            exit 1
          fi

          cp \
            data/generated-testcases-artifact/generated-testcases.json \
            data/generated-testcases.json

          echo ""
          echo "✅ generated-testcases.json ready."

      # --------------------------------------------------
      # 6. Verify generated test cases
      # --------------------------------------------------

      - name: Verify generated test cases
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED TEST CASES"
          echo "======================================"

          if [ ! -f "data/generated-testcases.json" ]; then
            echo "ERROR: generated-testcases.json not found."
            exit 1
          fi

          echo "Generated test cases file found."

          echo ""

          echo "Ticket:"
          node -e "
            const data = require('./data/generated-testcases.json');
            console.log(data.ticketId);
          "

          echo ""

          echo "Total generated test cases:"
          node -e "
            const data = require('./data/generated-testcases.json');
            console.log(data.testCases?.length || 0);
          "

          echo ""

          echo "======================================"
          echo "GENERATED TEST CASES"
          echo "======================================"

          node -e "
            const data = require('./data/generated-testcases.json');

            for (const tc of data.testCases || []) {
              console.log(
                tc.id +
                ' | ' +
                (tc.category || tc.testType || 'UNCATEGORIZED') +
                ' | ' +
                tc.title
              );
            }
          "

      # --------------------------------------------------
      # 7. Filter ONLY selected test cases
      # --------------------------------------------------

      - name: Filter selected test cases
        env:
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
        run: |
          echo "======================================"
          echo "FILTERING SELECTED TEST CASES"
          echo "======================================"

          echo "Selected IDs:"
          echo "$SELECTED_TEST_CASES"

          echo ""

          node scripts/ai-agent/filter-selected-testcases.js

          echo ""

          echo "======================================"
          echo "SELECTED TEST CASES FILE"
          echo "======================================"

          cat data/selected-testcases.json

      # --------------------------------------------------
      # 8. Verify selection
      # --------------------------------------------------

      - name: Verify selected test cases
        run: |
          echo "======================================"
          echo "VERIFYING SELECTED TEST CASES"
          echo "======================================"

          node - <<'NODE'
          const fs = require("fs");

          const file = "data/selected-testcases.json";

          if (!fs.existsSync(file)) {
            console.error("ERROR: selected-testcases.json was not created.");
            process.exit(1);
          }

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const selected = data.selectedTestCases || [];

          console.log(`Selected count: ${selected.length}`);

          if (!selected.length) {
            console.error("ERROR: No test cases were selected.");
            process.exit(1);
          }

          console.log("");

          selected.forEach((tc) => {
            console.log(
              `${tc.id} | ${
                tc.category ||
                tc.testType ||
                "UNCATEGORIZED"
              } | ${tc.title}`
            );
          });

          console.log("");
          console.log("✅ Selected test cases verified.");
          NODE

      # --------------------------------------------------
      # 9. Process approved Notion ticket
      # --------------------------------------------------

      - name: Process approved ticket
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TICKET_ID: ${{ inputs.ticket_id }}
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          node scripts/ai-agent/process-approved-ticket.js

      # --------------------------------------------------
      # 10. Prepare Claude automation prompt
      # --------------------------------------------------

      - name: Prepare Claude test-generation prompt
        env:
          SELECTED_TEST_CASES: ${{ inputs.selected_test_cases }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          node scripts/prepare-claude-test.js

      # --------------------------------------------------
      # 11. Install Claude Code
      #
      # We call the CLI directly instead of claude-code-action@v1.
      # claude-code-action is built around PR/issue-comment triggers
      # and posts results back as review comments ("buffered inline
      # comments") rather than reliably writing files in a
      # workflow_dispatch context. The direct CLI with
      # --permission-mode acceptEdits is what actually lets Claude
      # write files unattended in a headless run.
      # --------------------------------------------------

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 12. Verify Claude Code
      # --------------------------------------------------

      - name: Verify Claude Code
        run: |
          claude --version

      # --------------------------------------------------
      # 13. Save repository baseline
      #
      # Lets us positively confirm what Claude changed,
      # independent of the later git status check.
      # --------------------------------------------------

      - name: Save repository baseline
        run: |
          git status --short > /tmp/baseline-status.txt

          git diff -- \
            tests \
            pages \
            locators \
            utils \
            fixture \
            data \
            playwright.config.js \
            package.json \
            > /tmp/baseline-diff.txt || true

          echo "Baseline captured."

      # --------------------------------------------------
      # 14. Generate Playwright tests using Claude Code
      # --------------------------------------------------

      - name: Generate Playwright tests with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e

          claude \
            --permission-mode acceptEdits \
            --max-turns 50 \
            --allowedTools "Bash,Edit,Write,mcp__playwright__*" \
            --mcp-config .mcp.json \
            -p "$(cat data/claude-test-generation-prompt.md)" \
            2>&1 | tee /tmp/claude-test-generation.log

          CLAUDE_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "Claude test-generation exit code: $CLAUDE_EXIT"

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "WARNING: Claude test generation returned non-zero."
            echo "We will inspect the repository before deciding whether"
            echo "the run actually failed to produce anything usable."
          fi

          exit 0

      # --------------------------------------------------
      # 15. Show Claude output
      # --------------------------------------------------

      - name: Show Claude test-generation log
        if: always()
        run: |
          echo "======================================"
          echo "CLAUDE TEST-GENERATION LOG"
          echo "======================================"

          if [ -f /tmp/claude-test-generation.log ]; then
            cat /tmp/claude-test-generation.log
          else
            echo "No Claude log was generated."
          fi

      # --------------------------------------------------
      # 16. Create PR
      # --------------------------------------------------

      - name: Commit generated tests and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai/${{ inputs.ticket_id }}-tests"

          echo "======================================"
          echo "CHECKING GENERATED PLAYWRIGHT TESTS"
          echo "======================================"

          git config user.name "tailorbird-ai-agent[bot]"
          git config user.email "tailorbird-ai-agent[bot]@users.noreply.github.com"

          echo "Full working-tree status:"
          git status --short

          echo ""
          echo "Untracked files:"
          git ls-files --others --exclude-standard

          if [ -z "$(git status --porcelain -- tests/)" ]; then
            echo ""
            echo "No test file changes were produced by Claude Code."
            echo ""
            echo "Last Claude output:"
            tail -n 100 /tmp/claude-test-generation.log || true
            echo ""
            echo "Skipping PR creation."
            exit 0
          fi

          echo ""
          echo "Test files changed:"
          git status --short -- tests/

          echo ""

          echo "======================================"
          echo "CREATING AI TEST AUTOMATION BRANCH"
          echo "======================================"

          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git branch -D "$BRANCH"
          fi

          git checkout -b "$BRANCH"

          git add tests/

          SUMMARY="$(git diff --stat --cached)"

          echo ""
          echo "Changes:"
          echo "$SUMMARY"

          git commit \
            -m "AI-generated Playwright tests for ${{ inputs.ticket_id }}"

          git push --force-with-lease origin "$BRANCH"

          echo ""
          echo "======================================"
          echo "CREATING PULL REQUEST"
          echo "======================================"

          EXISTING_PR="$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$EXISTING_PR" ]; then
            echo ""
            echo "Existing PR found: #$EXISTING_PR"
            echo "Branch updated successfully."
            exit 0
          fi

          gh pr create \
            --title "AI-generated tests for ${{ inputs.ticket_id }}" \
            --body "Ticket: ${{ inputs.ticket_id }}"$'\n\n'"Selected test cases: ${{ inputs.selected_test_cases }}"$'\n\n'"Generation run ID: ${{ inputs.generation_run_id }}"$'\n\n'"Files changed:"$'\n'"$SUMMARY" \
            --base main \
            --head "$BRANCH"

          echo ""
          echo "✅ Pull request created."

      # --------------------------------------------------
      # 17. Upload debug artifacts
      #
      # Always upload, even on failure/skip, so we can see
      # exactly what Claude did without re-running.
      # --------------------------------------------------

      - name: Upload automation debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-approved-ticket-debug-${{ inputs.ticket_id }}
          if-no-files-found: ignore
          path: |
            /tmp/claude-test-generation.log
            /tmp/baseline-status.txt
            /tmp/baseline-diff.txt
            data/claude-test-generation-prompt.md
            data/selected-testcases.json